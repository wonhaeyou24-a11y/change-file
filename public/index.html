<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보고서 표 변환기</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>보고서 표 변환기</h1>
    <p class="sub">원본 자료를 보고서용 표(Word / Excel)로 변환합니다.</p>

    <form id="convertForm">
      <label class="field">
        <span>모드</span>
        <select id="mode">
          <option value="basic">기본양식모드 — 내장 양식으로 정리 (AI 미사용)</option>
          <option value="universal">만능양식모드 — 업로드한 양식으로 AI가 정리</option>
        </select>
      </label>

      <!-- ── 기본양식모드 ── -->
      <div id="mode-basic">
        <label class="field">
          <span>양식 선택</span>
          <select id="basicFormat">
            <option value="slope">절토사면형 — No/점검종류/점검기간/점검기관/평가등급/점검결과</option>
            <option value="wall">옹벽형 — No/수행기간·구분/점검기관·기술자/안전등급/점검결과/보수보강안</option>
            <option value="weather">강우량 — 기상청 강수량 분석 (연도/발생일/최다 일강수량 3분할 + 누년 평균값)</option>
          </select>
        </label>

        <div id="basic-default">
          <label class="field">
            <span>표 제목 (선택)</span>
            <input type="text" id="title" placeholder="점검진단실적" />
          </label>
        </div>

        <div id="basic-weather" hidden>
          <label class="field">
            <span>지점 표시명 (비우면 파일의 지점명 사용)</span>
            <input type="text" id="stationName" placeholder="예: 통영" />
          </label>
          <label class="field">
            <span>표 번호</span>
            <input type="text" id="tableNo" placeholder="6.2-5" />
          </label>
          <label class="field">
            <span>표 제목(캡션)</span>
            <input type="text" id="caption" placeholder="기상청 강수량 분석 결과" />
          </label>
        </div>
      </div>

      <!-- ── 만능양식모드 (AI) ── -->
      <div id="mode-universal" hidden>
        <label class="field dropzone" id="tmplzone">
          <span>양식 파일 — 빈 표 (.xlsx / .xls / .csv / 이미지 png·jpg / .pdf)</span>
          <input type="file" id="templateInput" accept=".xlsx,.xlsm,.xls,.csv,.png,.jpg,.jpeg,.webp,.pdf" />
          <span id="templateName" class="filename">양식 파일을 선택하세요</span>
        </label>
        <label class="field">
          <span>AI 제공자</span>
          <select id="provider"></select>
        </label>
        <label class="field">
          <span><span id="keyLabel">Gemini</span> API 키</span>
          <input type="password" id="apiKey" placeholder="API 키" autocomplete="off" spellcheck="false" />
          <small class="hint">키는 이번 변환에만 쓰이고 서버·브라우저 어디에도 저장되지 않습니다. 배포 코드에도 포함되지 않습니다.</small>
          <small class="hint" id="keyGetHint"></small>
        </label>
        <label class="field">
          <span>AI 모델 <button type="button" id="loadModels" class="mini">이 키로 쓸 수 있는 모델 불러오기</button></span>
          <input id="model" list="modelList" placeholder="예: gemini-flash-latest" autocomplete="off" spellcheck="false" />
          <datalist id="modelList"></datalist>
          <small class="hint">모델명을 직접 입력해도 됩니다. 목록은 안내용이라 최신이 아닐 수 있으니, 키 입력 후 "불러오기"로 실제 사용 가능한 모델을 확인하세요.</small>
        </label>
        <label class="field">
          <span>추가 지시사항 (선택)</span>
          <input type="text" id="instructions" placeholder="예: 발생일은 yyyy.mm.dd 로, 평균은 소수 2자리" />
        </label>
      </div>

      <label class="field dropzone" id="dropzone">
        <span id="dropLabel">자료 파일</span>
        <input type="file" id="fileInput" required />
        <span id="fileName" class="filename">파일을 선택하거나 여기로 드래그하세요</span>
      </label>

      <button type="submit" id="submitBtn">변환하기</button>
    </form>

    <div id="status" class="status" hidden></div>

    <div id="result" class="result" hidden>
      <h2>변환 완료</h2>
      <p id="rowCountText"></p>
      <div class="downloads">
        <a id="docxLink" class="btn" download>Word(.docx) 다운로드</a>
        <a id="xlsxLink" class="btn" download>Excel(.xlsx) 다운로드</a>
      </div>
      <p id="aiNotes" class="hint" hidden></p>
      <h3>미리보기</h3>
      <div id="previewTable"></div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
